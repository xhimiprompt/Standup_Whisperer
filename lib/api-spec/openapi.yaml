openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: standup
    description: Standup conversion operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /standup/process:
    post:
      operationId: processStandup
      tags: [standup]
      summary: Convert raw notes into a clean standup (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandupInput"
      responses:
        "200":
          description: SSE stream of the formatted standup output
          content:
            text/event-stream: {}
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StandupInput:
      type: object
      properties:
        notes:
          type: string
          description: Raw unformatted standup notes
          minLength: 1
        format:
          type: string
          enum: [plain, slack, markdown]
          description: Output format for the standup
      required:
        - notes
        - format
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
